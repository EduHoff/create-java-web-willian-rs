services:
  app:
    build: .
    container_name: app_web
    ports:
      - "${APP_PORT:-8081}:8080"
    command: >
      sh -c '
        echo "==================================================";
        echo " Application status: READY";
        echo " URL: http://localhost:${APP_PORT:-8081}";
        echo "==================================================";
        exec catalina.sh run
      '
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-myapp_db}
      - DB_USER=${DB_USER:-admin}
      - DB_PASS=${DB_PASS:-123}
    volumes:
      - ./web:/usr/local/tomcat/webapps/ROOT
